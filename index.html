<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Rays Kalender</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Rays Kalender">
    <meta name="theme-color" content="#eef5ef">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                Arial,
                sans-serif;

            background: #eef5ef;
            color: #173f32;
        }

        .app {
            min-height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            padding: 25px 20px 30px;
        }

        /* =========================
           KOPF
        ========================= */

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 34px;
            font-weight: 800;
        }

        .header p {
            margin: 8px 0 0;
            color: #668077;
            font-size: 16px;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .navigation {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            background: white;
            padding: 6px;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        }

        .navigation button {
            flex: 1;
            border: none;
            border-radius: 12px;
            padding: 12px 6px;
            background: transparent;
            color: #668077;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .navigation button.aktiv {
            background: #237d63;
            color: white;
        }

        /* =========================
           KARTEN
        ========================= */

        .kalender,
        .seiten-karte {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        /* =========================
           MONAT
        ========================= */

        .monat-kopf {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .monat-kopf h2 {
            margin: 0;
            font-size: 23px;
        }

        .monat-kopf h3 {
            margin: 0;
            font-size: 20px;
        }

        .pfeil {
            border: none;
            background: #e7f1ea;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 23px;
            color: #173f32;
            cursor: pointer;
        }

        /* =========================
           KALENDER
        ========================= */

        .wochentage,
        .tage {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 7px;
        }

        .wochentag {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: #82938d;
            padding-bottom: 8px;
        }

        .tag {
            aspect-ratio: 1;
            border: none;
            border-radius: 13px;
            background: #f4f7f5;
            font-size: 15px;
            font-weight: 600;
            color: #173f32;
            cursor: pointer;
        }

        .tag.heute {
            box-shadow: inset 0 0 0 3px #173f32;
        }

        /* =========================
           KATEGORIEN
        ========================= */

        /* UNI = ROT */

        .tag.uni {
            background: #D9534F;
            color: white;
        }

        /* TÜV NORD = BLAU */

        .tag.tuev {
            background: #2878C8;
            color: white;
        }

        /* BIERGARTEN = BRAUN */

        .tag.biergarten {
            background: #8B5E3C;
            color: white;
        }

        /* URLAUB = GRÜN */

        .tag.urlaub {
            background: #2E9B62;
            color: white;
        }

        /* FREI = HELLGRÜN */

        .tag.frei {
            background: #8BCF9B;
            color: white;
        }

        /* =========================
           LEGENDE
        ========================= */

        .legende {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .legende span {
            font-size: 13px;
            font-weight: 700;
            padding: 7px 10px;
            border-radius: 10px;
            color: white;
        }

        .legende-uni {
            background: #D9534F;
        }

        .legende-tuev {
            background: #2878C8;
        }

        .legende-biergarten {
            background: #8B5E3C;
        }

        .legende-urlaub {
            background: #2E9B62;
        }

        .legende-frei {
            background: #8BCF9B;
        }

        /* =========================
           NEUER EINTRAG
        ========================= */

        .neu-button {
            width: 100%;
            margin-top: 25px;
            border: none;
            border-radius: 18px;
            padding: 17px;
            background: #237d63;
            color: white;
            font-size: 17px;
            font-weight: 700;
            box-shadow: 0 6px 18px rgba(35,125,99,0.25);
            cursor: pointer;
        }

        /* =========================
           FORMULAR
        ========================= */

        #eintrag-fenster {
            display: none;
            margin-top: 20px;
            background: white;
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
        }

        #eintrag-fenster h2 {
            margin-top: 0;
        }

        #eintrag-fenster label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        #eintrag-fenster input,
        #eintrag-fenster select,
        #eintrag-fenster textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6e1dc;
            border-radius: 12px;
            background: #f8faf9;
            font-size: 16px;
        }

        #eintrag-fenster textarea {
            min-height: 90px;
            resize: vertical;
        }

        #eintrag-speichern,
        #eintrag-loeschen,
        #eintrag-abbrechen {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            border: none;
            border-radius: 13px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        #eintrag-speichern {
            margin-top: 20px;
            background: #237d63;
            color: white;
        }

        #eintrag-loeschen {
            background: #E57373;
            color: white;
        }

        #eintrag-abbrechen {
            background: #e7f1ea;
            color: #173f32;
        }

        /* =========================
           STUNDEN
        ========================= */

        #stunden-seite {
            display: none;
        }

        .stunden-box {
            padding: 18px;
            margin-top: 12px;
            background: #f4f7f5;
            border-radius: 16px;
        }

        .stunden-box span {
            display: block;
            color: #668077;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .stunden-box strong {
            display: block;
            font-size: 21px;
        }

        .tuev-box {
            border-left: 5px solid #2878C8;
        }

        .biergarten-box {
            border-left: 5px solid #8B5E3C;
        }

        /* =========================
           DATENSICHERUNG
        ========================= */

        .backup-karte {
            margin-top: 20px;
        }

        .backup-buttons {
            display: grid;
            gap: 10px;
            margin-top: 15px;
        }

        .backup-buttons button {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        #daten-exportieren {
            background: #237d63;
            color: white;
        }

        #daten-import-button {
            background: #e7f1ea;
            color: #173f32;
        }

        .hinweis {
            color: #668077;
            font-size: 13px;
            line-height: 1.5;
        }

    </style>

</head>

<body>

<div class="app">

    <!-- =========================
         KOPF
    ========================= -->

    <header class="header">

        <h1>Rays Kalender</h1>

        <p>Uni, Arbeit & Freizeit</p>

    </header>

    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav class="navigation">

        <button
            id="nav-kalender"
            class="aktiv"
        >
            Kalender
        </button>

        <button id="nav-stunden">
            Stunden
        </button>

    </nav>

    <!-- =========================
         KALENDER
    ========================= -->

    <section id="kalender-seite">

        <div class="kalender">

            <div class="monat-kopf">

                <button
                    class="pfeil"
                    id="monat-zurueck"
                >
                    ‹
                </button>

                <h2 id="monat-titel"></h2>

                <button
                    class="pfeil"
                    id="monat-weiter"
                >
                    ›
                </button>

            </div>

            <div class="wochentage">

                <div class="wochentag">Mo</div>
                <div class="wochentag">Di</div>
                <div class="wochentag">Mi</div>
                <div class="wochentag">Do</div>
                <div class="wochentag">Fr</div>
                <div class="wochentag">Sa</div>
                <div class="wochentag">So</div>

            </div>

            <div
                class="tage"
                id="kalender-tage"
            ></div>

            <div class="legende">

                <span class="legende-uni">
                    🎓 Uni
                </span>

                <span class="legende-tuev">
                    🛠️ TÜV Nord
                </span>

                <span class="legende-biergarten">
                    🍺 Biergarten
                </span>

                <span class="legende-urlaub">
                    🏖️ Urlaub
                </span>

                <span class="legende-frei">
                    Frei
                </span>

            </div>

        </div>

        <button
            class="neu-button"
            id="neuer-eintrag"
        >
            + Neuer Eintrag
        </button>

        <!-- =========================
             FORMULAR
        ========================= -->

        <div id="eintrag-fenster">

            <h2 id="formular-titel">
                Neuer Eintrag
            </h2>

            <label for="eintrag-datum">
                Datum
            </label>

            <input
                type="date"
                id="eintrag-datum"
            >

            <label for="eintrag-kategorie">
                Kategorie
            </label>

            <select id="eintrag-kategorie">

                <option value="uni">
                    🎓 Uni
                </option>

                <option value="tuev">
                    🛠️ TÜV Nord
                </option>

                <option value="biergarten">
                    🍺 Biergarten
                </option>

                <option value="urlaub">
                    🏖️ Urlaub
                </option>

                <option value="frei">
                    🟢 Frei
                </option>

            </select>

            <div id="zeit-bereich">

                <label for="eintrag-beginn">
                    Beginn
                </label>

                <input
                    type="time"
                    id="eintrag-beginn"
                >

                <label for="eintrag-ende">
                    Ende
                </label>

                <input
                    type="time"
                    id="eintrag-ende"
                >

            </div>

            <label for="eintrag-kommentar">
                Kommentar
            </label>

            <textarea
                id="eintrag-kommentar"
                placeholder="z. B. Frühschicht oder Veranstaltung"
            ></textarea>

            <button id="eintrag-speichern">
                Speichern
            </button>

            <button id="eintrag-loeschen">
                Eintrag löschen
            </button>

            <button id="eintrag-abbrechen">
                Abbrechen
            </button>

        </div>

        <!-- =========================
             DATENSICHERUNG
        ========================= -->

    </section>

    <!-- =========================
         STUNDEN
    ========================= -->

    <section id="stunden-seite">

        <div class="seiten-karte">

            <h2>Stundenübersicht</h2>

            <div class="monat-kopf">

                <button
                    class="pfeil"
                    id="stunden-zurueck"
                >
                    ‹
                </button>

                <h3 id="stunden-monat-titel"></h3>

                <button
                    class="pfeil"
                    id="stunden-weiter"
                >
                    ›
                </button>

            </div>

            <div class="stunden-box tuev-box">

                <span>
                    🛠️ TÜV Nord
                </span>

                <strong id="tuev-stunden">
                    0 Stunden
                </strong>

            </div>

            <div class="stunden-box biergarten-box">

                <span>
                    🍺 Biergarten
                </span>

                <strong id="biergarten-stunden">
                    0 Stunden
                </strong>

            </div>

        </div>

    </section>

</div>

<script>

    /* =========================
       MONATE
    ========================= */

    const monate = [
        "Januar",
        "Februar",
        "März",
        "April",
        "Mai",
        "Juni",
        "Juli",
        "August",
        "September",
        "Oktober",
        "November",
        "Dezember"
    ];

    const heute = new Date();

    let jahr = heute.getFullYear();
    let monat = heute.getMonth();

    const monatTitel =
        document.getElementById("monat-titel");

    const kalenderTage =
        document.getElementById("kalender-tage");

    const kategorieFeld =
        document.getElementById("eintrag-kategorie");

    const zeitBereich =
        document.getElementById("zeit-bereich");

    const eintragFenster =
        document.getElementById("eintrag-fenster");

    /* =========================
       SPEICHER
    ========================= */

    function eintraegeLaden() {

        return JSON.parse(
            localStorage.getItem("rays-kalender")
        ) || [];

    }

    function eintraegeSpeichern(eintraege) {

        localStorage.setItem(
            "rays-kalender",
            JSON.stringify(eintraege)
        );

    }

    /* =========================
       DATUM
    ========================= */

    function datumErzeugen(tag) {

        return (
            jahr +
            "-" +
            String(monat + 1).padStart(2, "0") +
            "-" +
            String(tag).padStart(2, "0")
        );

    }

    /* =========================
       ZEITFELDER
    ========================= */

    function zeitenAktualisieren() {

        const kategorie =
            kategorieFeld.value;

        if (
            kategorie === "tuev" ||
            kategorie === "biergarten"
        ) {

            zeitBereich.style.display =
                "block";

        }

        else {

            zeitBereich.style.display =
                "none";

        }

    }

    /* =========================
       FORMULAR LEEREN
    ========================= */

    function formularLeeren(datum = "") {

        document
            .getElementById("formular-titel")
            .textContent =
            "Neuer Eintrag";

        document
            .getElementById("eintrag-datum")
            .value =
            datum;

        kategorieFeld.value =
            "uni";

        document
            .getElementById("eintrag-beginn")
            .value =
            "";

        document
            .getElementById("eintrag-ende")
            .value =
            "";

        document
            .getElementById("eintrag-kommentar")
            .value =
            "";

        document
            .getElementById("eintrag-loeschen")
            .style.display =
            "none";

        zeitenAktualisieren();

    }

    /* =========================
       EINTRAG ÖFFNEN
    ========================= */

    function formularMitEintragOeffnen(datum) {

        const vorhandenerEintrag =
            eintraegeLaden().find(
                function (eintrag) {

                    return (
                        eintrag.datum === datum
                    );

                }
            );

        if (vorhandenerEintrag) {

            document
                .getElementById("formular-titel")
                .textContent =
                "Eintrag bearbeiten";

            document
                .getElementById("eintrag-datum")
                .value =
                vorhandenerEintrag.datum;

            kategorieFeld.value =
                vorhandenerEintrag.kategorie;

            document
                .getElementById("eintrag-beginn")
                .value =
                vorhandenerEintrag.beginn || "";

            document
                .getElementById("eintrag-ende")
                .value =
                vorhandenerEintrag.ende || "";

            document
                .getElementById("eintrag-kommentar")
                .value =
                vorhandenerEintrag.kommentar || "";

            document
                .getElementById("eintrag-loeschen")
                .style.display =
                "block";

            zeitenAktualisieren();

        }

        else {

            formularLeeren(datum);

        }

        eintragFenster.style.display =
            "block";

    }

    /* =========================
       KALENDER
    ========================= */

    function kalenderAnzeigen() {

        kalenderTage.innerHTML = "";

        monatTitel.textContent =
            monate[monat] +
            " " +
            jahr;

        const ersterTag =
            new Date(
                jahr,
                monat,
                1
            );

        const letzterTag =
            new Date(
                jahr,
                monat + 1,
                0
            ).getDate();

        const leereFelder =
            (ersterTag.getDay() + 6) % 7;

        const eintraege =
            eintraegeLaden();

        for (
            let i = 0;
            i < leereFelder;
            i++
        ) {

            kalenderTage.appendChild(
                document.createElement("div")
            );

        }

        for (
            let tag = 1;
            tag <= letzterTag;
            tag++
        ) {

            const button =
                document.createElement("button");

            const datum =
                datumErzeugen(tag);

            button.className =
                "tag";

            button.textContent =
                tag;

            const gespeicherterEintrag =
                eintraege.find(
                    function (eintrag) {

                        return (
                            eintrag.datum === datum
                        );

                    }
                );

            if (gespeicherterEintrag) {

                button.classList.add(
                    gespeicherterEintrag.kategorie
                );

            }

            if (
                tag === heute.getDate() &&
                monat === heute.getMonth() &&
                jahr === heute.getFullYear()
            ) {

                button.classList.add(
                    "heute"
                );

            }

            button.addEventListener(
                "click",
                function () {

                    formularMitEintragOeffnen(
                        datum
                    );

                }
            );

            kalenderTage.appendChild(
                button
            );

        }

    }

    /* =========================
       ZEITBERECHNUNG
    ========================= */

    function zeitInMinuten(zeit) {

        const teile =
            zeit
                .split(":")
                .map(Number);

        return (
            teile[0] * 60 +
            teile[1]
        );

    }

    function stundenBerechnen(
        beginn,
        ende
    ) {

        if (!beginn || !ende) {

            return 0;

        }

        const start =
            zeitInMinuten(beginn);

        let stopp =
            zeitInMinuten(ende);

        if (stopp <= start) {

            stopp +=
                24 * 60;

        }

        return (
            stopp - start
        ) / 60;

    }

    function formatStunden(stunden) {

        return (
            stunden.toLocaleString(
                "de-DE",
                {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }
            ) +
            " Stunden"
        );

    }

    /* =========================
       STUNDENÜBERSICHT
    ========================= */

    function stundenAnzeigen() {

        const monatsPraefix =
            jahr +
            "-" +
            String(monat + 1)
                .padStart(2, "0") +
            "-";

        let tuevStunden = 0;
        let biergartenStunden = 0;

        eintraegeLaden().forEach(
            function (eintrag) {

                if (
                    !eintrag.datum.startsWith(
                        monatsPraefix
                    )
                ) {

                    return;

                }

                const stunden =
                    stundenBerechnen(
                        eintrag.beginn,
                        eintrag.ende
                    );

                if (
                    eintrag.kategorie === "tuev"
                ) {

                    tuevStunden +=
                        stunden;

                }

                if (
                    eintrag.kategorie === "biergarten"
                ) {

                    biergartenStunden +=
                        stunden;

                }

            }
        );

        document
            .getElementById("stunden-monat-titel")
            .textContent =
            monate[monat] +
            " " +
            jahr;

        document
            .getElementById("tuev-stunden")
            .textContent =
            formatStunden(
                tuevStunden
            );

        document
            .getElementById("biergarten-stunden")
            .textContent =
            formatStunden(
                biergartenStunden
            );

    }

    /* =========================
       MONAT WECHSELN
    ========================= */

    function monatAendern(richtung) {

        monat += richtung;

        if (monat < 0) {

            monat = 11;
            jahr--;

        }

        if (monat > 11) {

            monat = 0;
            jahr++;

        }

        kalenderAnzeigen();
        stundenAnzeigen();

    }

    /* =========================
       SEITEN
    ========================= */

    function seiteAnzeigen(seite) {

        document
            .getElementById("kalender-seite")
            .style.display =
            seite === "kalender"
                ? "block"
                : "none";

        document
            .getElementById("stunden-seite")
            .style.display =
            seite === "stunden"
                ? "block"
                : "none";

        document
            .querySelectorAll(
                ".navigation button"
            )
            .forEach(
                function (button) {

                    button.classList.remove(
                        "aktiv"
                    );

                }
            );

        document
            .getElementById(
                "nav-" + seite
            )
            .classList.add(
                "aktiv"
            );

        if (seite === "stunden") {

            stundenAnzeigen();

        }

    }

    /* =========================
       MONATSBUTTONS
    ========================= */

    document
        .getElementById("monat-zurueck")
        .addEventListener(
            "click",
            function () {

                monatAendern(-1);

            }
        );

    document
        .getElementById("monat-weiter")
        .addEventListener(
            "click",
            function () {

                monatAendern(1);

            }
        );

    document
        .getElementById("stunden-zurueck")
        .addEventListener(
            "click",
            function () {

                monatAendern(-1);

            }
        );

    document
        .getElementById("stunden-weiter")
        .addEventListener(
            "click",
            function () {

                monatAendern(1);

            }
        );

    /* =========================
       KATEGORIE
    ========================= */

    kategorieFeld.addEventListener(
        "change",
        zeitenAktualisieren
    );

    /* =========================
       NEUER EINTRAG
    ========================= */

    document
        .getElementById("neuer-eintrag")
        .addEventListener(
            "click",
            function () {

                formularLeeren();

                eintragFenster.style.display =
                    "block";

            }
        );

    /* =========================
       ABBRECHEN
    ========================= */

    document
        .getElementById("eintrag-abbrechen")
        .addEventListener(
            "click",
            function () {

                eintragFenster.style.display =
                    "none";

            }
        );

    /* =========================
       SPEICHERN
    ========================= */

    document
        .getElementById("eintrag-speichern")
        .addEventListener(
            "click",
            function () {

                const datum =
                    document
                        .getElementById(
                            "eintrag-datum"
                        )
                        .value;

                const kategorie =
                    kategorieFeld.value;

                const kommentar =
                    document
                        .getElementById(
                            "eintrag-kommentar"
                        )
                        .value;

                if (!datum) {

                    alert(
                        "Bitte wähle ein Datum aus."
                    );

                    return;

                }

                let beginn = "";
                let ende = "";

                if (
                    kategorie === "tuev" ||
                    kategorie === "biergarten"
                ) {

                    beginn =
                        document
                            .getElementById(
                                "eintrag-beginn"
                            )
                            .value;

                    ende =
                        document
                            .getElementById(
                                "eintrag-ende"
                            )
                            .value;

                }

                if (
                    (
                        kategorie === "tuev" ||
                        kategorie === "biergarten"
                    ) &&
                    (!beginn || !ende)
                ) {

                    alert(
                        "Bitte Beginn und Ende eingeben."
                    );

                    return;

                }

                const eintrag = {

                    datum: datum,
                    kategorie: kategorie,
                    beginn: beginn,
                    ende: ende,
                    kommentar: kommentar

                };

                let eintraege =
                    eintraegeLaden();

                eintraege =
                    eintraege.filter(
                        function (alterEintrag) {

                            return (
                                alterEintrag.datum !==
                                datum
                            );

                        }
                    );

                eintraege.push(
                    eintrag
                );

                eintraegeSpeichern(
                    eintraege
                );

                eintragFenster.style.display =
                    "none";

                kalenderAnzeigen();
                stundenAnzeigen();

                alert(
                    "Eintrag gespeichert."
                );

            }
        );

    /* =========================
       LÖSCHEN
    ========================= */

    document
        .getElementById("eintrag-loeschen")
        .addEventListener(
            "click",
            function () {

                const datum =
                    document
                        .getElementById(
                            "eintrag-datum"
                        )
                        .value;

                if (!datum) {

                    return;

                }

                let eintraege =
                    eintraegeLaden();

                eintraege =
                    eintraege.filter(
                        function (eintrag) {

                            return (
                                eintrag.datum !==
                                datum
                            );

                        }
                    );

                eintraegeSpeichern(
                    eintraege
                );

                eintragFenster.style.display =
                    "none";

                kalenderAnzeigen();
                stundenAnzeigen();

                alert(
                    "Eintrag gelöscht."
                );

            }
        );

    /* =========================
       NAVIGATION
    ========================= */

    document
        .getElementById("nav-kalender")
        .addEventListener(
            "click",
            function () {

                seiteAnzeigen(
                    "kalender"
                );

            }
        );

    document
        .getElementById("nav-stunden")
        .addEventListener(
            "click",
            function () {

                seiteAnzeigen(
                    "stunden"
                );

            }
        );

    /* =========================
       APP START
    ========================= */

    zeitenAktualisieren();
    kalenderAnzeigen();
    stundenAnzeigen();

</script>

</body>

</html>
